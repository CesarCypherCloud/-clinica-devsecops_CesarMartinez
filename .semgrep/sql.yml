rules:
  - id: sql-injection-taint
    mode: taint
    languages: [javascript]
    severity: ERROR
    message: Posible inyección SQL detectada. Usa consultas parametrizadas en lugar de concatenar datos del usuario.
    pattern-sources:
      - pattern: req.params
      - pattern: req.query
      - pattern: req.body
    pattern-sinks:
      - patterns:
          - pattern: $DB.query($QUERY, ...)
          - focus-metavariable: $QUERY
      - patterns:
          - pattern: $DB.get($QUERY, ...)
          - focus-metavariable: $QUERY
      - patterns:
          - pattern: $DB.all($QUERY, ...)
          - focus-metavariable: $QUERY
      - patterns:
          - pattern: $DB.run($QUERY, ...)
          - focus-metavariable: $QUERY
